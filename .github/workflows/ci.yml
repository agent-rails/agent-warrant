name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check
      - run: ruff format --check
      - run: pytest -q
      - run: |
          sudo groupadd --system agent-warrant-ledger
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin --gid agent-warrant-ledger agent-warrant-reader
          sudo usermod --append --groups agent-warrant-ledger "$(id -un)"
      - run: sg agent-warrant-ledger -c "python -m pytest -v -rs tests/test_ledger_cross_uid.py"
        env:
          AGENT_WARRANT_READER_USER: agent-warrant-reader
          AGENT_WARRANT_SHARED_GROUP: agent-warrant-ledger
