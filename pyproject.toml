[project]
name = "agent-warrant"
version = "0.1.0"
description = "A portable, cryptographically-verifiable authority grant for AI agents -- cross-org, no shared infrastructure."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "voltagebots" }]
keywords = ["ai", "agents", "authorization", "identity", "verifiable-credentials", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["cryptography>=42"]

[project.urls]
Homepage = "https://github.com/voltagebots/agent-warrant"
Repository = "https://github.com/voltagebots/agent-warrant"
Issues = "https://github.com/voltagebots/agent-warrant/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent_warrant"]

[tool.setuptools.package-data]
agent_warrant = ["py.typed"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
